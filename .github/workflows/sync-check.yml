name: sync-check

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Shared CLI rules are in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read                     # read the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check python-cli-packaging matches agent-friendly-cli
        run: python3 scripts/sync_shared.py --check
