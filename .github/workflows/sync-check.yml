name: sync-check

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Shared CLI rules are in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read                     # read the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check python-cli-packaging matches agent-friendly-cli
        run: python3 scripts/sync_shared.py --check

  repo-checks:
    name: Skills meet the specs and manifests agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read                     # read the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Agent Skills and Claude Code rules for every SKILL.md
        run: uv run -q scripts/check_skills.py
      - name: Folders, plugin.json and marketplace.json agree
        run: uv run -q scripts/check_registry.py
      - name: Manifest rules
        run: uv run -q scripts/lint_manifests.py
      - name: Counts in prose match the files
        run: uv run -q scripts/check_counts.py
      - name: README matches the marketplace
        run: uv run -q scripts/build_readme.py --check
      - name: skills.sh finds exactly the published skills
        run: uv run -q scripts/check_discovery.py
